# On-demand live recorder: append one live record (market + live news + Tier-2
# outlook) to data/<slug>/live.jsonl, no retraining.
#
# NOTE: the frequent cadence is owned by a LOCAL systemd timer
# (tools/record_live.sh -> ~/.config/systemd/user/rl-crypto-live.timer, every 30
# min) because GitHub Actions failed to deliver schedule events for this second
# workflow on a young repo. This workflow stays as the on-demand/backup path
# and can be pointed at any ticker from the Actions UI.
name: "live (on-demand recorder)"

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to record (default: the whole tracked watchlist)"
        required: false
        default: ""
      live_cap:
        description: "Max live.jsonl records to keep"
        required: false
        default: "1000"

permissions:
  contents: write

# Same group as pipeline.yml so the two cache writers serialize (no push races).
concurrency:
  group: rl-crypto-cache
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      # Sibling path sources, both public — same as the other workflows.
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/tickerkit
          path: tickerkit
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/ticker-news-signals
          path: ticker-news-signals

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: sync
        working-directory: rl-crypto
        run: uv sync --group dev

      - name: record live
        working-directory: rl-crypto
        env:
          TICKERS: ${{ inputs.tickers }}
          LIVE_CAP: ${{ inputs.live_cap || '1000' }}
        run: |
          args=()
          if [ -n "$TICKERS" ]; then
            args=(--tickers $TICKERS)
          fi
          uv run python tools/record_live.py \
            "${args[@]}" \
            --live-cap "$LIVE_CAP" \
            --fetch-timeout 120

      - name: commit live cache
        if: always()
        working-directory: rl-crypto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data
          if git diff --cached --quiet; then
            echo "no live cache change to commit"
          else
            git commit -m "live: record $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi