# Production watchdog: dispatch the production workflow when the ARCHIVE goes stale.
#
# GitHub's scheduled events are best-effort — under load they are delayed, and
# occasionally dropped outright. This hourly check reads the newest bar in the
# committed archive (`archive.spans[1]` of a summary, i.e. the data's own
# timestamp) and re-dispatches `production.yml` in TRAIN mode when it is older
# than the limit.
#
# Why the archive bar, not "the newest commit touching data/": a live run
# appends `live.jsonl`, and a `--retrain-only` run rewrites `summary.json`. Both
# touch `data/` without adding a single candle, so a commit-based clock reported
# a 7-hour-stale archive as fresh. The bar time cannot be masked that way.
#
# Why train mode: live mode never grows `candles.jsonl` or retrains, so a
# watchdog that dispatched live could not repair the thing it exists to repair.
#
# Why --repo: this job has no checkout, so `gh` cannot infer a repository from a
# git remote. Without it the dispatch died with "fatal: not a git repository".
#
# Tune with the repository variable RL_CRYPTO_MAX_AGE_MINUTES (default 75, i.e.
# two missed 30-minute ticks).
name: production watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write # dispatch another workflow
  contents: read

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dispatch production when the cache is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_MINUTES: ${{ vars.RL_CRYPTO_MAX_AGE_MINUTES || '75' }}
        run: |
          # The data's own timestamp: the newest archived bar, not the newest
          # commit that happened to touch data/.
          summary=$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/data/btc-usd/summary.json?ref=main" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)
          bar=$(printf '%s' "$summary" | jq -r '(.archive.spans // [])[1] // empty' 2>/dev/null || true)
          if [ -z "$bar" ]; then
            # Fallback: candles.jsonl is rewritten only when bars are added, so
            # a live record or a retrain-only summary cannot reset this clock.
            echo "::warning::could not read the archive span; falling back to the candles commit"
            bar=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits?path=data/btc-usd/candles.jsonl&per_page=1" \
              --jq '.[0].commit.committer.date')
          fi
          if [ -z "$bar" ] || [ "$bar" = "null" ]; then
            echo "::warning::no archive timestamp found — dispatching a train run"
          else
            age=$(( ( $(date -u +%s) - $(date -u -d "$bar" +%s) ) / 60 ))
            echo "newest archive bar: $bar (${age}m old, limit ${MAX_AGE_MINUTES}m)"
            if [ "$age" -lt "$MAX_AGE_MINUTES" ]; then
              echo "archive is fresh — nothing to do"
              exit 0
            fi
          fi
          gh workflow run production.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME:-main}" -f mode=train
          echo "dispatched production (mode=train)"
