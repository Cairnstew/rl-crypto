# Scheduled production run: grow the candle archive for every tracked ticker,
# retrain each Tier-1 bundle over its own archive, and append one live record —
# all committed back to the repo in a single commit.
#
# On schedule it processes the whole watchlist (src/rl_crypto/tickers.py);
# `workflow_dispatch` can narrow it to specific tickers. Tickers are processed
# one at a time on purpose: a deep history backfill spends many upstream calls
# per series, so they are paced rather than parallelised. One job (not a
# matrix) is also deliberate — a matrix would mean N concurrent writers racing
# to push the same `data/` tree.
#
# The commit from this workflow does NOT retrigger anything (no push trigger
# here), but it does re-run the offline CI, which is desirable: every cached
# state lands in a lint+test-green commit.
name: "pipeline (scheduled production run)"

on:
  schedule:
    # Every 2 hours on the hour (UTC). This is where the history archive grows
    # and models are retrained; the frequent live records come from the local
    # 30-minute timer (tools/record_live.sh), not from a workflow.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to run (default: the whole tracked watchlist)"
        required: false
        default: ""
      history_days:
        description: "Days of market history to fetch per run (archive is cumulative)"
        required: false
        default: "60"

permissions:
  contents: write

# Same group as live.yml so the two cache writers serialize (no push races).
concurrency:
  group: rl-crypto-cache
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    # One paced pass per ticker (history backfill + train), so the budget scales
    # with the watchlist; leave margin so the script's own hard-exit (never a
    # runner cap) ends the job cleanly.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      # rl-crypto consumes its upstreams as sibling path sources (~/../ layout);
      # both are public, so the auto GITHUB_TOKEN can read them.
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/tickerkit
          path: tickerkit
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/ticker-news-signals
          path: ticker-news-signals

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: sync
        working-directory: rl-crypto
        run: uv sync --group dev

      - name: run pipeline (grow archive -> train -> live outlook)
        working-directory: rl-crypto
        env:
          # Empty input = the runner's tracked watchlist; a value narrows it.
          TICKERS: ${{ inputs.tickers }}
          HISTORY_DAYS: ${{ inputs.history_days || '60' }}
        run: |
          args=()
          if [ -n "$TICKERS" ]; then
            args=(--tickers $TICKERS)
          fi
          uv run python tools/run_pipeline.py \
            "${args[@]}" \
            --history-days "$HISTORY_DAYS" \
            --timeframe 1h \
            --fetch-timeout 300
        # News HISTORY is intentionally never fetched here: training-time news
        # is reserved for RL training later. Live news flows through the unified
        # record on every run (and on the frequent local-timer runs).

      # Commit whatever the run produced. if: always() lets a partial-failure
      # run still land its notes/summary cache; an empty diff is a no-op.
      - name: commit cache back to the repo
        if: always()
        working-directory: rl-crypto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add models data
          if git diff --cached --quiet; then
            echo "no cache changes to commit"
          else
            git commit -m "pipeline: refresh cache at $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi