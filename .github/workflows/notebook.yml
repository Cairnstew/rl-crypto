name: Unified notebook smoke test

# Executes notebooks/unified.ipynb end-to-end. The notebook first syncs the
# checkout from the git remote (fetch + ff-only pull), then reads the committed
# cache under data/ + models/ — the live data upstreams are never called; the
# sibling checkouts are still needed for `uv sync` (path sources).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC

jobs:
  notebook:
    name: validate notebooks/unified.ipynb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/tickerkit
          path: tickerkit
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/ticker-news-signals
          path: ticker-news-signals
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: sync
        working-directory: rl-crypto
        run: uv sync --group dev
      - name: register project kernel (same spec Zed uses)
        working-directory: rl-crypto
        run: uv run python tools/install_kernel.py
      - name: execute notebook
        # Runs under the pinned `rl-crypto` kernel.
        working-directory: rl-crypto
        run: uv run python tools/validate_notebook.py --kernel rl-crypto --timeout 180