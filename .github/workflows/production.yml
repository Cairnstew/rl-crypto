# Production: the one scheduler for every cache writer.
#
# Every 30 minutes: record one live point per tracked ticker (no training).
# Every 2 hours (even UTC hour): grow each ticker's archive, retrain its Tier-1
# bundle over the whole archive, and append the live record in the same run.
#
# Shape: prepare -> (live | train) matrix, one job per ticker -> merge.
#
# Why one workflow: GitHub's schedule delivery proved unreliable for a second
# cron workflow on this repo, so both cadences share a single schedule and the
# run decides its mode from the clock. `watchdog.yml` dispatches this workflow
# when the cache goes stale, so a silent schedule drop self-heals.
#
# Matrix jobs never push. GitHub's `concurrency` group serialises workflow runs,
# not jobs inside a run, so N jobs pushing `main` at once would race and fail as
# non-fast-forwards. Each job stages only its own ticker's cache and uploads it
# as an artifact; the merge job is the single writer and makes ONE commit per
# run.
#
# The watchlist comes from src/rl_crypto/tickers.py (the one source of truth),
# read by the prepare job — it is not duplicated here. A fork that wants a
# different set sets the repository variable RL_CRYPTO_TICKERS (space- or
# comma-separated) instead of editing code; `workflow_dispatch` can narrow it
# per run.
#
# The commit does NOT retrigger this workflow (no push trigger), but it does
# re-run the offline CI, which is desirable: every cached state lands in a
# lint+test-green commit.
name: production

on:
  schedule:
    # Every 30 minutes. Even UTC hours also retrain (see the prepare job); the
    # archive itself is 1-hour bars, so switching this to "0 * * * *" is safe
    # and roughly halves the runs.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers to run (default: the tracked watchlist)"
        required: false
        default: ""
      mode:
        description: "live = append records only; train = archive + retrain + record"
        type: choice
        options:
          - train
          - live
        default: train
      history_days:
        description: "Days of market history to fetch on a train run (archive is cumulative)"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  # Resolve the watchlist and the cadence mode once, as JSON, so the matrix and
  # the merge commit message agree.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      - name: resolve watchlist and run mode
        id: plan
        working-directory: rl-crypto
        env:
          REQUESTED: ${{ inputs.tickers }}
          REQUESTED_MODE: ${{ inputs.mode }}
          # Fork knob: a repository variable narrows the watchlist without a
          # code edit (e.g. RL_CRYPTO_TICKERS="BTC/USD").
          WATCHLIST: ${{ vars.RL_CRYPTO_TICKERS }}
        run: |
          # tickers.py is dependency-free, so load that single file directly
          # instead of importing the package (which pulls in the whole tree).
          #
          # NOTE: this writes the GITHUB_OUTPUT file itself rather than being
          # redirected into it. A `>> "$GITHUB_OUTPUT"` redirect would also
          # capture the ::notice:: line below, and that file accepts only
          # key=value pairs — the run fails with "Invalid format".
          SCHEDULE_HOUR=$(date -u +%-H) python3 - <<'PY'
          import importlib.util, json, os

          spec = importlib.util.spec_from_file_location(
              "rl_tickers", "src/rl_crypto/tickers.py"
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          requested = os.environ.get("REQUESTED", "").strip()
          watchlist = os.environ.get("WATCHLIST", "").strip()
          if requested:
              tickers = mod.parse_tickers(requested)
          elif watchlist:
              tickers = mod.parse_tickers(watchlist)
          else:
              tickers = mod.TRACKED_TICKERS
          if not tickers:
              raise SystemExit("no tickers selected")

          # Emit {ticker, slug} pairs: a ticker like "BTC/USD" cannot be part of
          # an artifact NAME (slashes are rejected), so the cache slug travels
          # with it. The slug here must match rl_crypto.cache.slug_for.
          entries = [
              {"ticker": t, "slug": t.replace("/", "-").replace(" ", "-").lower()}
              for t in tickers
          ]

          mode = os.environ.get("REQUESTED_MODE", "").strip().lower()
          if mode not in ("train", "live"):
              # Scheduled run: retrain on even UTC hours, live-only on odd ones.
              mode = "train" if int(os.environ.get("SCHEDULE_HOUR", "0")) % 2 == 0 else "live"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(entries)}\n")
              fh.write(f"mode={mode}\n")
              fh.write(f"count={len(entries)}\n")
          print(f"::notice::production {mode}: {len(entries)} ticker(s) — {', '.join(tickers)}")
          PY

  # Frequent cadence: one live record per ticker, no training. Loads the
  # committed Tier-1 bundles, so a brand-new ticker needs one train run first.
  live:
    needs: prepare
    if: needs.prepare.outputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One bad ticker must not cancel the rest; the surviving caches are still
      # merged and the failure is visible per-job in the UI.
      fail-fast: false
      # Bounded parallelism keeps upstream request volume sane.
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      # rl-crypto consumes its upstreams as sibling path sources (~/../ layout);
      # both are public, so the auto GITHUB_TOKEN can read them.
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/tickerkit
          path: tickerkit
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/ticker-news-signals
          path: ticker-news-signals

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: sync
        working-directory: rl-crypto
        run: uv sync --group dev

      - name: record live
        working-directory: rl-crypto
        env:
          TICKER: ${{ matrix.entry.ticker }}
        run: |
          uv run rl-pipeline live \
            --tickers "$TICKER" \
            --live-cap 1000 \
            --fetch-timeout 120

      # Collect THIS ticker's live cache under a fixed layout for the merge job.
      # if: always() so a partial run still contributes whatever it produced.
      - name: stage cache
        if: always()
        working-directory: rl-crypto
        env:
          SLUG: ${{ matrix.entry.slug }}
        run: |
          rm -rf /tmp/rl-cache
          mkdir -p /tmp/rl-cache/data
          if [ -d "data/$SLUG" ]; then
            cp -r "data/$SLUG" /tmp/rl-cache/data/
            echo "staged data/$SLUG"
          fi
          find /tmp/rl-cache -type f | head -10

      - name: upload cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.entry.slug }}
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/rl-cache

  # Slow cadence: grow the archive, rebuild features/labels, retrain Tier-1,
  # append one live record. Runs on even UTC hours (or a dispatch with mode=train).
  train:
    needs: prepare
    if: needs.prepare.outputs.mode == 'train'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/tickerkit
          path: tickerkit
      - uses: actions/checkout@v4
        with:
          repository: Cairnstew/ticker-news-signals
          path: ticker-news-signals

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: sync
        working-directory: rl-crypto
        run: uv sync --group dev

      - name: run pipeline (grow archive -> train -> live outlook)
        working-directory: rl-crypto
        env:
          TICKER: ${{ matrix.entry.ticker }}
          HISTORY_DAYS: ${{ inputs.history_days || '60' }}
        run: |
          uv run rl-pipeline run \
            --tickers "$TICKER" \
            --history-days "$HISTORY_DAYS" \
            --timeframe 1h \
            --fetch-timeout 300
        # News HISTORY is intentionally never fetched here: training-time news
        # is reserved for RL training later. Live news flows through the unified
        # record on every run (train and live alike).

      - name: stage cache
        if: always()
        working-directory: rl-crypto
        env:
          SLUG: ${{ matrix.entry.slug }}
        run: |
          rm -rf /tmp/rl-cache
          mkdir -p /tmp/rl-cache/data /tmp/rl-cache/models
          if [ -d "data/$SLUG" ]; then
            cp -r "data/$SLUG" /tmp/rl-cache/data/
            echo "staged data/$SLUG"
          fi
          if [ -f "models/$SLUG.json" ]; then
            cp "models/$SLUG.json" /tmp/rl-cache/models/
            echo "staged models/$SLUG.json"
          fi
          find /tmp/rl-cache -type f | head -10

      - name: upload cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.entry.slug }}
          retention-days: 1
          if-no-files-found: ignore
          path: /tmp/rl-cache

  # The single writer: collect every ticker's artifact and make ONE commit.
  # Runs even when some matrix jobs failed, so a partial pass still lands.
  merge:
    needs:
      - prepare
      - live
      - train
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialise the pushers only (not the whole run): two merges must never push
    # at the same time, while live/train matrices run freely.
    concurrency:
      group: rl-crypto-cache
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: rl-crypto

      - name: download cache artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cache-*
          merge-multiple: true
          # NOTE: this path is relative to the WORKSPACE ROOT, not to the
          # checkout dir, so it must be prefixed with `rl-crypto/` to sit next
          # to the checkout. Getting this wrong makes the copy below silently
          # find nothing and the run report "no cache changes" having done
          # all the work — which is exactly what happened the first time.
          path: rl-crypto/staging

      - name: merge caches into the checkout
        working-directory: rl-crypto
        run: |
          # Fail loudly rather than silently no-op: if no artifact arrived the
          # caches must NOT be reported as up to date.
          if [ ! -d staging/data ] && [ ! -d staging/models ]; then
            echo "::error::no cache artifacts were downloaded — refusing to report a no-op refresh"
            ls -la staging 2>/dev/null || echo "staging/ missing entirely"
            exit 1
          fi

          if [ -d staging/data ]; then
            cp -r staging/data/. data/
          fi
          if [ -d staging/models ]; then
            mkdir -p models
            cp -r staging/models/. models/
          fi
          echo "--- merged cache inventory ---"
          python3 - <<'PY'
          import glob, json
          rows = 0
          for path in sorted(glob.glob("data/*/summary.json")):
              try:
                  d = json.load(open(path))
              except Exception as exc:
                  print(f"  {path}: unreadable ({exc})")
                  continue
              rows += 1
              print(
                  f"  {d.get('ticker', path):<9} rows={d['archive']['rows']:<5}"
                  f" targets={len(d.get('targets', {}))}"
                  f" live={d['live']['market_ok']}"
              )
          print(f"  ({rows} ticker caches present)")
          PY

      - name: commit cache back to the repo
        working-directory: rl-crypto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add models data
          if git diff --cached --quiet; then
            echo "no cache changes to commit"
            exit 0
          fi
          # Only touched when there is a cache write: a run that collected
          # nothing must not produce a README-only commit. A render failure is
          # a warning, never a reason to drop the cache.
          python3 tools/render_dashboard.py || echo "::warning::dashboard render failed"
          git add README.md
          if [ "$MODE" = "train" ]; then
            git commit -m "pipeline: refresh cache at $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            git commit -m "live: record $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          # A hand push or a manual local run can land between checkout and push, so a
          # non-fast-forward is expected occasionally: rebase, resolve, retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed cache refresh"
              exit 0
            fi
            echo "push attempt $attempt rejected — rebasing onto origin"
            if ! git pull --rebase -q origin main; then
              # README is generated inside the dashboard markers: keep upstream's
              # text (human edits) and re-render it from the merged cache below.
              if git diff --name-only --diff-filter=U | grep -qx 'README.md'; then
                git checkout --ours -- README.md
                git add README.md
              fi
              # The resolver is stdlib-only, so no `uv sync` is needed here.
              python3 src/rl_crypto/pipeline/conflicts.py --root .
              if [ -f tools/render_dashboard.py ]; then
                python3 tools/render_dashboard.py || echo "::warning::dashboard render failed"
                git add README.md
              fi
              GIT_EDITOR=true git rebase --continue
            fi
          done
          echo "could not push after retries"
          exit 1
